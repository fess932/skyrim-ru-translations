  drawBreakdown('Расходы на управление','Записанные недельные расходы по статьям.',rows.slice(5).filter(([label]) => !label.startsWith('Tax Revenue ')));
  article.appendChild(columns);
  article.appendChild(drawTaxPreview(pages));
}

function render(pages, fallback) {
  const previousPage = selected;
  const previousScroll = article.scrollTop;
  function open(name) {
    selected = name;
    article.replaceChildren();
    article.scrollTop = 0;
    const heading = document.createElement('h2');
    heading.textContent = ruText(name);
    const advisors = {
      Treasury:['hq','Hadrian Quintus','Мастер над монетой','Проверьте казну, последние сборы и расходы на управление Скайримом.'],
      Economy:['cv','Calveera Valenne','Глас Короны','Направляйте экономику, дипломатию и общественное мнение Скайрима.'],
      Military:['gs','Ghorlak','Лорд-командующий','Оцените численность, классы и опыт своих войск.'],
      Faith:['ba','Brother Arthorian','Верховный жрец Скайрима','Проверьте состояние веры в королевстве и его владениях.'],
      Justice:['os','Ogrun Steelvein','Мастер цепей','Изучите записи о задержанных в королевстве.']
    };
    const advisor = advisors[name];
    if (advisor) {
      const [key,person,office,description] = advisor;
      const banner = makeElement('section','section-banner');
      const portrait = (window.ledgerCouncilArt || {})[key];
      if (portrait) {
        const image = makeElement('img','');
        image.src = portrait;
        image.alt = ruText(person);
        banner.appendChild(image);
      }
      const copy = makeElement('div','');
      copy.append(makeElement('small','',office),heading,makeElement('strong','',ruText(person)),makeElement('p','',description));
      const summonSeat = {Treasury:'1',Economy:'3',Faith:'4',Justice:'6'}[name];
      if (summonSeat) copy.appendChild(profileSummon(person,summonSeat));
      banner.appendChild(copy);
      article.appendChild(banner);
    } else {
      article.appendChild(heading);
    }
    nav.querySelectorAll('button').forEach(button => {
      if (button.dataset.page === name) button.setAttribute('aria-current','page');
      else button.removeAttribute('aria-current');
    });
    if (name === 'Economy') { drawEconomy(); return; }
    if (name === 'Settings') { drawSettings(); return; }
    if (name === 'Help') {
      drawHandbook();
      return;
    }
    if (name === 'Path to the Crown') {
      drawCrownPath();
      return;
    }
    if (name === 'Overview') {
      drawAtlas(pages);
      return;
    }
    if (name === 'Court') {
      const grid = makeElement('div','court-grid');
      const status = makeElement('p','summon-result');
      status.setAttribute('role','status');
      const portraits = window.ledgerCouncilArt || {};
      councilRoster.forEach(([position,person,portraitKey], index) => {
        const office = makeElement('section','court-office');
        const portrait = makeElement('img','council-portrait');
        const source = npcPortrait(person) || portraits[portraitKey];
        portrait.src = source || art.sigil;
        portrait.alt = source ? ruText(person) : 'Герб BHKS';
        const summon = makeElement('button','','Призвать');
        summon.setAttribute('aria-label','Призвать: ' + ruText(person));
        summon.disabled = !window.magelight;
        summon.onclick = () => {
          status.textContent = 'Призыв: ' + ruText(person) + '…';
          sendLedgerAction('bhksSummon', String(index),summon);
        };
        office.append(portrait,makeElement('h3','',ruText(person)),makeElement('p','',position));
        if (councilAccess && councilAccess[index] === 1) office.appendChild(summon);
        else office.appendChild(makeElement('p','ledger-note','Место пустует. Поговорите с Сургусом, чтобы найти подходящего кандидата.'));
        grid.appendChild(office);
      });
      article.append(status,grid);
      return;
    }
    if (name === 'Royal Spouse') {
      drawRoyalSpouse();
      return;
    }
    if (name === 'Appointments') {
      drawRoyalRegister(pages);
      return;
    }
    if (name === 'Faith') {
      drawChurch(pages);
      return;
    }
    if (name === 'Holds') {
      drawHoldGallery(pages);
      return;
    }
    if (name === 'Justice') {
      drawJustice(pages.Justice);
      return;
    }
    if (name === 'Treasury') {
      drawTreasury(pages.Treasury, pages);
      return;
    }
    if (name === 'Military') { drawArmyManagement(pages); return; }
    const list = makeElement('dl','record-grid');
    pages[name].forEach(([label,value]) => {
      const row = document.createElement('div');
      const term = document.createElement('dt');
      const detail = document.createElement('dd');
      term.textContent = label;
      detail.textContent = value == null ? 'Нет данных' : typeof value === 'string' ? value : value.toLocaleString() + (name === 'Treasury' || label === 'Treasury' ? ' зол.' : label.endsWith('Approval') || label === 'Skyrim Approval' ? '%' : '');
      if (label.endsWith('Approval Change')) detail.className = value > 0 ? 'positive' : value < 0 ? 'negative' : '';
      row.append(term,detail);
      list.appendChild(row);
    });
    article.appendChild(list);
  }
  nav.replaceChildren();
  const menuPages = ['Path to the Crown', ...Object.keys(labels).flatMap(name => name === 'Treasury' ? [name,'Economy'] : [name]), 'Royal Spouse', 'Settings', 'Help'];
  menuPages.forEach(name => {
    const button = document.createElement('button');
    button.textContent = name === 'Help' ? 'Королевское руководство' : ruText(name);
    button.dataset.page = name;
    button.prepend(icon(name));
    button.hidden = !councilPageAvailable(name);
    button.disabled = button.hidden || (!['Help','Settings'].includes(name) && !pages[name]);
    button.onclick = () => open(name);
    nav.appendChild(button);
  });
  if (art.sigil) {
    const sigil = makeElement('img','sigil');
    sigil.src = art.sigil;
    sigil.alt = 'Корона и скрещенные мечи BHKS';
    nav.appendChild(sigil);
  }
  open((pages[selected] || ['Help','Settings'].includes(selected)) && councilPageAvailable(selected) ? selected : fallback);
  if (selected === previousPage) article.scrollTop = previousScroll;
}
window.showPathV3 = payload => {

  const values = decode(payload,42);
  if (!values) return;
  latestRealm = null;
  officeholders = null;
  justiceCases = null;
  marchState = [];
  churchState = null;
  royalRegister = null;
  royalSpouse = null;
  taxPreviewState = null;
  const first = crownProgress == null;
  crownProgress = values;
  if (first) crownRouteTab = values[4] > 0 ? 'moot' : 'traditional';
  render({'Path to the Crown':[]},'Path to the Crown');
};
window.showRealmV3 = payload => {

  crownProgress = null;
  const values = decode(payload, Object.values(labels).reduce((count, rows) => count + rows.length, 25));
  if (!values) return;
  latestRealm = values;
  let index = 0;
  const pages = {};
  Object.keys(labels).forEach(name => {
    pages[name] = labels[name].map(label => [label,values[index++]]);
  });
  const [approval, treasury, faith, economy, reignStage] = values;
  pages.Overview = [
    ['Treasury', treasury],
    ['Skyrim Approval', approval],
    ['Faith Level', faith],
    ['Economy Status', economy == null ? null : (['Крах', 'Спад', 'Застой', 'Стабильность', 'Процветание'][economy] || 'Крах')],
    ['Reign quest stage', reignStage]
  ];
  const holdNames = {Windhelm:'Eastmarch', Solitude:'Haafingar', Riften:'The Rift', Markarth:'The Reach', Morthal:'Hjaalmarch', Dawnstar:'The Pale'};
  pages.Holds = pages.Holds.map(([label, value]) => {
    const [, hold, delta] = label.split(' ');
    return [(holdNames[hold] || hold) + (delta ? ' approval change' : ' approval'), value];
  });
  const revenue = pages.Treasury.filter(([label]) => label.startsWith('Tax Revenue'));
  const mine = pages.Treasury.find(([label]) => label === 'Last Mine Revenue')[1];
  const expenses = pages.Treasury.find(([label]) => label === 'Total')[1];
  const income = revenue.every(([,value]) => value != null)
    ? revenue.reduce((total,[,value]) => total + value, 0) : null;
  const net = [income, mine, expenses].every(value => value != null) ? income + mine - expenses : null;
  pages.Treasury = [['Balance', treasury], ['Weekly Income', income], ['Mine Revenue', mine],
    ['Weekly Expenses', expenses], ['Net Profit/Loss', net], ...revenue];
  const appointmentNames = {'Citizen Count':'Citizens','Noble Count':'Thanes','Ranger Count':'Rangers','Knight Count':'Knights'};
  pages.Appointments = pages.Appointments.map(([label,value]) => [appointmentNames[label],value]);
  const book = values.slice(index);
  pages.Overview.push(['Economy score', book[0] == null ? null : book[0] + ' / 100']);
  pages.Holds.push(['Highreach approval', book[1]], ['Highreach approval change', book[2]]);
  const expenseNames = ["Стража","Освещение городов и дорог","Водопровод и канализация","Инфраструктура","Содержание зданий","Назначенные жрецы"];
  pages.Treasury.push(...expenseNames.map((name,i) => [name,book[i+3]]));
  const holdNamesForTax = ["Whiterun","Eastmarch","Falkreath","Hjaalmarch","The Pale","The Reach","Winterhold","The Rift","Haafingar","Highreach Keep"];
  pages['Tax Rates'] = holdNamesForTax.map((name,i) => [name, book[i+9] == null ? null : book[i+9] + '%']);
  pages.Holds = pages.Holds.map(([label,value]) => [label.replace(/ approval change$/, ' Approval Change').replace(/ approval$/, ' Approval'),value]);
  taxHolds.slice(0,9).forEach((hold,i) => pages.Holds.push([hold + ' Jarl',officeholders ? officeholders[12+i] || 'Не назначен' : null]));
  pages.Court = councilOffices.map((position,i) => [position,officeholders ? officeholders[i] : null]);
  const total = pages.Military[0][1];
  const [warriors,archers,mages,veterans,elites,champions] = book.slice(19);
  const complete = [total,warriors,archers,mages,veterans,elites,champions].every(value => value != null);
  const unassigned = complete ? total - warriors - archers - mages : null;
  const assessment = !complete ? null : champions >= 5 ? 'Элитная боевая сила.' :
    champions > 0 && elites > 10 ? 'Очень опытная армия.' : elites > 5 ? 'Закаленные в боях войска.' :
    veterans > 10 ? 'Солдаты набираются опыта.' : unassigned > total / 2 ? 'Многим новобранцам нужна подготовка.' : 'Армии не хватает боевого опыта.';
  pages.Military = [['Всего войск',total],['Воины',warriors],['Лучники',archers],['Маги',mages],
    ...(unassigned > 0 ? [['Нераспределенные новобранцы',unassigned]] : []),['Ветераны',veterans],
    ['Элита',elites],['Чемпионы',champions],['Оценка',assessment]];
  pages['Royal Spouse'] = [];
  pages.Economy = [];
  render(pages,'Overview');
};
</script></html>
